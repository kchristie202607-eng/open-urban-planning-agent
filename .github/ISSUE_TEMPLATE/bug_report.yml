name: 缺陷报告 / Bug Report
description: 报告公共框架或工作流中的问题（请勿提交任何私有规划数据）
title: "[Bug] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢报告！请**仅使用合成或公开信息**描述问题，切勿粘贴真实规划项目、GIS 文件、客户或企业资料。
  - type: textarea
    id: what-happened
    attributes:
      label: 发生了什么？
      description: 清晰、简洁地描述问题。
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: 复现步骤（使用合成输入）
      description: 如何使用合成 / 公开输入复现该问题。
      placeholder: |
        1. 运行 ...
        2. 使用 examples/ 中的合成输入 ...
        3. 观察到 ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: 环境
      description: 操作系统、Python 版本、提交哈希等。
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: 隐私确认
      options:
        - label: 本报告中不含任何私有规划数据、GIS 文件或凭证
          required: true
