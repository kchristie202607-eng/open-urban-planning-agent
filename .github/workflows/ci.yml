name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint (ruff)
        run: ruff check . || true

      - name: Run tests
        run: pytest tests/ -q

      # Guard: ensure no private paths are committed
      - name: Privacy guard
        run: |
          if git ls-files | grep -E '^(data/|output/|project_state/|backups/|tmp/|\.workbuddy/|\.deps/)'; then
            echo "ERROR: private path detected in tracked files"
            exit 1
          fi
